    <!-- Fetch property patch & Anti-Flash Theme Script -->
    <script>
      (function() {
        // Prevent TypeError if environment wrapper/script attempts to set window.fetch
        try {
          if (typeof window !== 'undefined') {
            var origFetch = window.fetch ? window.fetch.bind(window) : undefined;
            var currentFetch = origFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
        } catch (e) {}

        // Anti-flash Theme Init
        try {
          var saved = localStorage.getItem('paywise-theme') || localStorage.getItem('paywise_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark) || (saved === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
            } catch (e) {}
      })();
    </script>
